<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KANBAN</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main>
        <nav>
            <div class="left">Kanban</div>
            <div class="right">
                <button id="toggle-modal">Add new Task</button>
            </div>
        </nav>

        <section class="board">
            <div id="todo" class="task-column">
                <div class="heading">
                    <div class="left">ToDo</div>
                    <div class="right count">0</div>
                </div>

                <div draggable="true" class="task">
                    <h2>Task1</h2>
                    <p>Description for task 1</p>
                    <button class="delete-btn">Delete</button>
                </div>
            </div>

            <div id="progress" class="task-column">
                <div class="heading">
                    <div class="left">In Progress</div>
                    <div class="right count">0</div>
                </div>
            </div>

            <div id="done" class="task-column">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right count">0</div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal add-new-task">
        <div class="bg"></div>

        <div class="center">
            <input
                id="task-title"
                type="text"
                placeholder="Task Title"
            />
            <textarea
                id="task-description"
                placeholder="Task Description"
            ></textarea>

            <button id="add-new-task-btn" class="add-task-btn">Add Task</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
